# Development manifest: persistent vision and embedding processing.
# Seed prepares matching and preserves progress between runs.
# Exit 0 means ready; exit 2 means preparation remains unfinished.
# Fresh preparation may require retries or additional daily allowance.
# Full-capstone completion is not claimed.
# Requires installed dependencies, Docker, and a configured root .env.
run: "python backend/scripts/run_demo.py"
seed: "python backend/scripts/seed_demo.py"
test: "python -m pytest -c backend/pytest.ini -q --tb=short"
base_url: "http://127.0.0.1:8000"
endpoints:
  - method: GET
    path: /health
  - method: GET
    path: /jobs/{job_id}
    headers:
      X-Tenant-ID: demo

  - method: GET
    path: /posts/{post_id}/images
    headers:
      X-Tenant-ID: demo